<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <!-- Versión reducida de la marca. El arco va sólido y no punteado a
       propósito: a 16px los puntos de la ruta se empastan y el icono se
       vuelve ruido. Se conservan los dos extremos, que son lo que comunica
       origen y destino. -->
  <path d="M18 39 Q32 0 46 39" fill="none" stroke="#a9a7ff" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="18" cy="39" r="7" fill="#ffffff"/>
  <circle cx="46" cy="39" r="7" fill="#7370ff"/>
</svg>
